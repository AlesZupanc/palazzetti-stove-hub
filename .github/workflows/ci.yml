# Tests on every push and pull request. When they pass on main, the branch "deploy" is
# moved to that commit. The VPS and the Pis that were set up with --auto-update
# (www/deploy.sh, pi/install.sh; tools/auto-update.sh) follow that branch, so only
# tested code reaches them - about a minute after the tests pass.
#
# Whoever can push to "deploy" runs code as root on those computers, so the one job that can
# write ("promote") runs nothing but actions/checkout and git. Every action is pinned to the
# commit of a release (the tag is in the comment; Dependabot proposes updates), the tests get a
# read-only token they do not even keep, and pip installs only the hashed files of
# tests/requirements.txt. A pull request from a fork runs its own copy of this file, but GitHub
# always gives such runs a read-only token and no secrets, so they cannot move "deploy" (and with
# "Require approval for all external contributors" they only run once a maintainer allows it).
# The workflow uses no secrets at all; in a public repository its runs and logs are public too,
# and they hold only the test output.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:           # Actions -> CI -> Run workflow: e.g. once in a new fork, to create deploy

permissions:
  contents: read               # a job without its own "permissions:" can only read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: pip and the tests never see the token
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"      # Debian bookworm: Raspberry Pi OS and the VPS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"          # the WebSocket and crypto.js tests also run against Node
      # only the wheels listed in tests/requirements.txt, checked against their hashes (no setup.py
      # runs); a block, because ":all: " on one plain YAML line would be read as a mapping
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v

  promote:
    needs: test
    # main itself only (a push or Run workflow): never a pull request, nor a trigger added later
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # push "deploy" - the only job with a token that can write
    concurrency:
      group: promote-deploy
      cancel-in-progress: false
    steps:
      # keeps its credentials (the default): the push below needs them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only forward: when the tests of two pushes finish out of order (or an old run is re-run),
      # deploy keeps the newer commit. (If main's history is ever rewritten, move deploy by hand.)
      - name: Move the deploy branch to this tested commit
        run: |
          if git rev-parse -q --verify origin/deploy >/dev/null && ! git merge-base --is-ancestor origin/deploy HEAD; then
            echo "deploy already holds a newer commit ($(git rev-parse --short origin/deploy)) - not moving it back"
            exit 0
          fi
          git push --force origin HEAD:refs/heads/deploy
